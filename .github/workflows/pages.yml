name: Rebuild Demo

# Pages 由仓库 Settings → Pages（main 分支 /docs 目录）直接托管已提交的静态文件。
# 本 workflow 仅在需要时重建 docs/demo，并把结果作为 artifact 供人工检查。
on:
  workflow_dispatch:

jobs:
  rebuild-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build demo
        run: python scripts/build_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: demo-html
          path: docs/demo
